<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>p0ssess</title>
<link rel="icon" href="ghost.svg" type="image/svg+xml">
<link rel="preload" href="fonts/obel-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="lockup">
    <img class="ghost" src="ghost.svg" width="45" height="45" alt="">
    <svg class="wordmark" viewBox="0 0 34 9" shape-rendering="crispEdges" role="img" aria-label="p0ssess"><path class="wm-ink" d="M0 2h3v1h-3zM0 3h1v1h-1zM3 3h1v1h-1zM0 4h1v1h-1zM3 4h1v1h-1zM0 5h3v1h-3zM0 6h1v1h-1zM0 7h1v1h-1zM0 8h1v1h-1zM11 2h3v1h-3zM10 3h1v1h-1zM11 4h2v1h-2zM13 5h1v1h-1zM10 6h3v1h-3zM16 2h3v1h-3zM15 3h1v1h-1zM16 4h2v1h-2zM18 5h1v1h-1zM15 6h3v1h-3zM21 2h2v1h-2zM20 3h1v1h-1zM23 3h1v1h-1zM20 4h4v1h-4zM20 5h1v1h-1zM21 6h3v1h-3zM26 2h3v1h-3zM25 3h1v1h-1zM26 4h2v1h-2zM28 5h1v1h-1zM25 6h3v1h-3zM31 2h3v1h-3zM30 3h1v1h-1zM31 4h2v1h-2zM33 5h1v1h-1zM30 6h3v1h-3z"/><path class="wm-zero" d="M6 0h2v1h-2zM5 1h1v1h-1zM8 1h1v1h-1zM5 2h1v1h-1zM8 2h1v1h-1zM5 3h1v1h-1zM8 3h1v1h-1zM5 4h1v1h-1zM8 4h1v1h-1zM5 5h1v1h-1zM8 5h1v1h-1zM6 6h2v1h-2z"/></svg>
  </div>
  <p class="updated" id="updated" role="status"></p>
  <button class="pill" type="button" id="open-settings" aria-haspopup="dialog">Settings</button>
</header>

<main>
  <section class="figures" aria-label="Spend and usage">
    <div class="fig">
      <h2>Today</h2>
      <p class="big" id="today">&nbsp;</p>
      <p class="sub" id="today-sub">&nbsp;</p>
    </div>
    <div class="fig wide">
      <h2>This month</h2>
      <p class="big"><span id="month">&nbsp;</span><span class="of" id="month-cap"></span></p>
      <div class="meter" id="month-meter" role="img" aria-label="Monthly spend"><span></span></div>
      <p class="sub" id="month-sub">&nbsp;</p>
    </div>
    <div class="fig">
      <h2>Running</h2>
      <p class="big" id="running-n">&nbsp;</p>
      <p class="sub" id="running">&nbsp;</p>
    </div>
    <div class="fig">
      <h2>Claude</h2>
      <p class="big" id="claude">&nbsp;</p>
      <p class="sub" id="claude-sub">&nbsp;</p>
    </div>
  </section>

  <section class="lower">
    <div class="col">
      <h2>Recent</h2>
      <ol class="runs" id="runs"></ol>
    </div>
    <div class="col">
      <h2>Limits</h2>
      <ul class="pills" id="limits"></ul>
      <h2 class="next">Rules</h2>
      <ul class="rules" id="rules"></ul>
      <div id="suggestions"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <p>Served from <span id="where">this machine</span>; no outside requests. To change a limit or add a rule, tell Claude in plain words.</p>
</footer>

<dialog class="sheet" id="settings-sheet" aria-labelledby="settings-h">
  <form id="settings" class="settings" method="dialog" autocomplete="off" novalidate>
    <div class="sheet-head">
      <h2 id="settings-h">Settings</h2>
      <button class="pill quiet" type="button" id="close-settings">Close</button>
    </div>
    <div class="grid">
      <label>Monthly cap, US$<input name="monthly_usd" inputmode="decimal"></label>
      <label>Run without asking up to, per task<input name="per_task_usd" inputmode="decimal"></label>
      <label>Daily limit (0 paces, −1 off)<input name="daily_usd" inputmode="decimal"></label>
      <label>Claude plan<select name="plan"><option value="auto">Detect</option><option value="subscription">Subscription</option><option value="api">API key</option></select></label>
      <label>Pressure curve<select name="lambda.preset" id="preset"></select></label>
      <label>Privacy<select name="privacy.mode"><option value="no-training">No training</option><option value="zdr">Zero retention only</option></select></label>
      <label class="span2">Never use these models<input name="models.deny" placeholder="author/model, author" spellcheck="false"></label>
      <label>Avoid these providers<input name="providers.deny" placeholder="Provider" spellcheck="false"></label>
      <label class="span2">Your own status line command<input name="statusline.command" spellcheck="false"></label>
      <div class="checks">
        <label class="check"><input type="checkbox" name="ask.first_use"> Ask before a model's first run</label>
        <label class="check"><input type="checkbox" name="ask.code_edits"> Ask before agent edits</label>
        <label class="check"><input type="checkbox" name="save_claude"> Save Claude</label>
        <label class="check"><input type="checkbox" name="usage_credits"> Usage credits on</label>
        <label class="check"><input type="checkbox" name="privacy.allow_safety_retention"> Allow safety retention</label>
      </div>
    </div>
    <div class="actions"><button class="pill solid" type="submit" value="save">Save</button><span class="saved" id="saved" role="status"></span></div>
  </form>
</dialog>
</body>
</html>
