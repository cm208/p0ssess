license = "CC0-1.0"

[[sample]]
id = "math-1"
use_case = "math-reasoning"
prompt = "A bakery bakes in batches. The first batch makes 18 loaves, and every later batch makes 4 more loaves than the batch before it. The bakery keeps baking batch after batch until its running total reaches 200 loaves or more. How many loaves are in the final batch?"
answer = "42"
check = "number"
tolerance = 0
source = "generated by scripts/calibration-samples/generate.py; word problem written for this set, answer computed by simulation"
license = "CC0-1.0"

