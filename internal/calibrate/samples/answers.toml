# Built-in calibration samples. Every file here is generated by p0ssess's own script
# (scripts/calibration-samples) or is public domain or CC0; each sample names its source and license.

[[sample]]
id = "transcribe-clean"
use_case = "audio-transcribe"
file = "clean.mp3"
prompt = "Transcribe the speech."
output = "transcript"
answer = "The Mole had been working very hard all the morning, spring cleaning his little home. First with brooms, then with dusters; then on ladders and steps and chairs, with a brush and a pail of whitewash."
check = "wer"
max_wer = 0.25
source = "generated by scripts/calibration-samples/generate.py; synthetic speech reading an excerpt of Grahame, The Wind in the Willows (1908), public domain"
license = "CC0-1.0"

[[sample]]
id = "transcribe-radio"
use_case = "audio-transcribe-noisy"
file = "radio.mp3"
prompt = "Transcribe the speech."
output = "transcript"
answer = "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do. Once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it."
check = "wer"
max_wer = 0.4
source = "generated by scripts/calibration-samples/generate.py; synthetic speech over band-limited pink noise, reading an excerpt of Carroll, Alice's Adventures in Wonderland (1865), public domain"
license = "CC0-1.0"

[[sample]]
id = "beeps"
use_case = "audio-events"
file = "beeps.mp3"
prompt = "This clip contains short beeps (pure tones) over faint background hiss. How many separate beeps are there?"
answer = "6"
check = "number"
tolerance = 0
source = "generated by scripts/calibration-samples/generate.py; sine-tone beeps at irregular times over low-level noise"
license = "CC0-1.0"

[[sample]]
id = "ocr-label"
use_case = "ocr-degraded-image"
file = "label.jpg"
prompt = "This is a degraded image of a parts label. What is the part code printed in large type?"
answer = "XW-26276-K"
check = "exact"
source = "generated by scripts/calibration-samples/generate.py; rendered label with a made-up code, then rotated, blurred, noised and JPEG-compressed"
license = "CC0-1.0"

[[sample]]
