  <title id="t">The /p0ssess:p0ssess-me card on a new install</title>
  <desc id="d">A terminal card. p0ssess 1.1.0, nothing running. Today $0.00 of $1.00, with an empty meter: the daily limit warns. Month $0.00 of $10.00, with an empty meter: paid runs stop at the cap. Limits: asks above $0.25 a task, no-training. Under the card, the address of the local page on 127.0.0.1 and how to change a limit: tell Claude "cap OpenRouter at $5" or "always ask before grok".</desc>
