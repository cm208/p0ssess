<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">The p0ssess status line segment in its four states</title>
  <desc id="d">Four lines as the terminal shows them. Calm, in gray: p0ssess $0.42/$1. While something runs, a little brighter: p0ssess $0.42/$1, 1 running (deepseek-v4.1-flash-1017). Near the daily limit, in amber: p0ssess $0.91/$1. When the monthly cap is reached, in red: p0ssess month cap $10.00/$10, paid runs stopped.</desc>
  <rect x="0.75" y="0.75" width="1198.5" height="198.5" rx="8" fill="#0b0b0b" stroke="#2a2a2a" stroke-width="1.5"/>
  <g id="output" font-family="'Obel Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'Cascadia Mono', Consolas, 'Noto Sans Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace">
    <path d="M29.32 46.6V38.24A5.28 5.28 0 0 1 39.88 38.24V46.6L34.6 42.44Z" fill="none" stroke="#808080" stroke-width="1.76" stroke-linejoin="round"/>
    <text x="54.4" y="47.48" font-size="22" fill="#808080" textLength="211.2" lengthAdjust="spacing">p0ssess $0.42/$1</text>
    <path d="M29.32 86.6V78.24A5.28 5.28 0 0 1 39.88 78.24V86.6L34.6 82.44Z" fill="none" stroke="#bcbcbc" stroke-width="1.76" stroke-linejoin="round"/>
    <text x="54.4" y="87.48" font-size="22" fill="#bcbcbc" textLength="726" lengthAdjust="spacing">p0ssess $0.42/$1 · 1 running (deepseek-v4.1-flash-1017)</text>
    <path d="M29.32 126.6V118.24A5.28 5.28 0 0 1 39.88 118.24V126.6L34.6 122.44Z" fill="none" stroke="#ffaf00" stroke-width="1.76" stroke-linejoin="round"/>
    <text x="54.4" y="127.48" font-size="22" fill="#ffaf00" textLength="211.2" lengthAdjust="spacing">p0ssess $0.91/$1</text>
    <path d="M29.32 166.6V158.24A5.28 5.28 0 0 1 39.88 158.24V166.6L34.6 162.44Z" fill="none" stroke="#ff5f5f" stroke-width="1.76" stroke-linejoin="round"/>
    <text x="54.4" y="167.48" font-size="22" fill="#ff5f5f" textLength="633.6" lengthAdjust="spacing">p0ssess month cap $10.00/$10 · paid runs stopped</text>
  </g>
  <g id="notes" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
