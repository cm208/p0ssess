<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="381" viewBox="0 0 1200 381" role="img" aria-labelledby="t d">
  <title id="t">The first card of the p0ssess tour</title>
  <desc id="d">A terminal card titled p0ssess tour, 1 of 4. Welcome to p0ssess. Glad you're here. Claude stays in charge. Heavy, bulk and media work goes to cheaper models on OpenRouter, inside limits you set. You, then Claude, then p0ssess, then a cheaper model; back comes the result plus (model, cost, saved). Three quick steps: your limits, a live demo, where to look. Beside it, the two choices: Start the tour, about a minute with one live demo capped at $0.01, or Skip the tour, which /p0ssess:tour runs again any time.</desc>
  <rect x="0.75" y="0.75" width="1198.5" height="379.5" rx="8" fill="#0b0b0b" stroke="#2a2a2a" stroke-width="1.5"/>
  <g id="output" font-family="'Obel Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'Cascadia Mono', Consolas, 'Noto Sans Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace">
