# p0ssess use-case catalog. Schema: catalog/schema.json; field guide: catalog/README.md.
# Costs are list-price estimates before OpenRouter's 5.5% credit fee; size profiles are assumptions, not measurements.
version: 1.0.0
as_of: '2026-11-09'
size_profiles:
  T: 1k in / 50 out
  S: 5k in / 1k out
  M: 30k in / 3k out
  R: 30k in / 6k out (review with reasoning, billed as output)
  L: 200k in / 4k out
use_cases:
- n: 1
  id: quick-code-question
  origin: first-pass
  task: One-turn coding question
  inputs:
  - text
  outputs:
  - text
  stakes: 1
  stakes_reason: Read-only answer; errors are obvious.
  quality_bar: Correct and short.
  path: keep_on_claude
  recommended: anthropic/claude-sonnet-5.5
  alternatives:
  - deepseek/deepseek-v4.1-flash
  - anthropic/claude-haiku-5.5
  - z-ai/glm-5.3-flash
  est_cost_usd:
    min: 0.058
    max: 0.058
  cost_assumptions: 'Median 1-turn Claude Code session on Claude Sonnet 5.5 (SC). Delegated: $0.001–0.002 of OpenRouter cash,
    but the hand-off overhead is about the size of the task.'
  budget_sensitivity: low
  verify:
    level: spot
    method: If delegated, Claude checks the answer it relays.
  evidence:
  - source: 'OpenRouter Data API: session cost (CC BY 4.0)'
    url: https://openrouter.ai/api/v1/datasets/session-cost
    as_of: '2026-11-02T07:25:14.332Z'
    detail: '1-turn medians: $0.001 (DeepSeek V4 Flash) to $0.058 (Sonnet 5.5)'
  - source: oc-connect delegation measurements
    url: https://github.com/jonaandresen/oc-connect/blob/main/docs/measured.md
    as_of: '2026-11-08'
  - source: Unpublished local reproduction of the hand-off overhead (Claude Code 2.1.319, Sonnet 5.5 lead, Haiku 5.5 relay,
      OpenCode with DeepSeek V4.1 Flash); summarized in docs/RESEARCH.md
    dataset: unpublished
    as_of: '2026-11-08'
  notes:
  - Recommended is the session's own lead model; Sonnet 5.5 is the price reference.
  - Delegating from a live session adds about $0.04–0.12 of lead-model hand-off and review turns (oc-connect and a local reproduction).
- n: 2
  id: sql-query-write
  origin: first-pass
  task: Write or explain SQL or a schema change
  inputs:
  - text
  - schema
  outputs:
  - SQL
  stakes: 2
  stakes_range:
  - 2
  - 4
  stakes_reason: Queries and development schemas are checkable; production schema changes are irreversible (stakes 4).
  quality_bar: Correct results.
  path: direct
  recommended: deepseek/deepseek-v4.1-flash
  alternatives:
  - z-ai/glm-5.3-flash
  - anthropic/claude-haiku-5.5
  - openai/gpt-6-luna
  est_cost_usd:
    min: 0.0005
    max: 0.0005
  cost_assumptions: Size S (5k in / 1k out) at list price.
  budget_sensitivity: low
  verify:
    level: mechanical
    method: Run the query or migration against a development or test database and compare results.
  evidence:
  - source: 'OpenRouter Data API: task classifications (CC BY 4.0)'
    url: https://openrouter.ai/api/v1/classifications/task
    as_of: '2026-11-08'
    detail: code:sql_database
  stakes_routing_change: Production schema changes move to prod-db-migration and stay on Claude.
  related:
  - prod-db-migration
  notes:
  - Queries and development schemas stay delegated.
- n: 3
  id: devops-config
  origin: first-pass
  task: Dockerfile, CI, compose and Kubernetes config
  inputs:
  - text
  outputs:
  - config
  stakes: 2
  stakes_range:
  - 2
  - 4
  stakes_reason: Dockerfile and CI drafts sit in a worktree; firewall, IaC and production Kubernetes are infrastructure (stakes
