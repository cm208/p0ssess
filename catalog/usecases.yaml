  recommended: deepseek/deepseek-v4.1-flash
  alternatives:
  - z-ai/glm-5.3-flash
  - openai/gpt-6.1-sol
  - anthropic/claude-haiku-5.5
  est_cost_usd:
    min: 0.004
    max: 0.004
  cost_assumptions: Median 2–9-turn session on DeepSeek V4.1 Flash (SC).
  budget_sensitivity: low
  verify:
    level: spot
    method: Claude checks the commands and their output.
  evidence:
  - source: 'OpenRouter Data API: task classifications (CC BY 4.0)'
    url: https://openrouter.ai/api/v1/classifications/task
    as_of: '2026-11-08'
    detail: code:shell_execution, 2.3% of tokens
  - source: 'OpenRouter Data API: session cost (CC BY 4.0)'
    url: https://openrouter.ai/api/v1/datasets/session-cost
    as_of: '2026-11-02T07:25:14.332Z'
  stakes_routing_change: Delegate only goals that stay inside the sandbox; production-facing commands stay on Claude with
    user approval.
  notes:
  - Session-cost medians carry no spread and no success rate; a cheap session that has to be redone is not reflected.
