  quality_bar: Valid and secure.
  path: direct
  recommended: deepseek/deepseek-v4.1-flash
  alternatives:
  - tencent/hy4-preview
  - moonshotai/kimi-k3.1-pro
  - anthropic/claude-sonnet-5.5
  est_cost_usd:
    min: 0.0005
    max: 0.002
  cost_assumptions: Size S–M at list price.
  budget_sensitivity: low
  verify:
    level: full
    method: Claude reviews the diff from a separate worktree.
  evidence:
  - source: 'OpenRouter Data API: task classifications (CC BY 4.0)'
    url: https://openrouter.ai/api/v1/classifications/task
    as_of: '2026-11-08'
    detail: code:devops_config, code:devops
  stakes_routing_change: Firewall, IaC and production config move to iac-firewall-change and stay on Claude.
  related:
  - iac-firewall-change
  notes: []
- n: 4
